<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Moose College — Learn Game Building Step by Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f6f2; --surface:#ffffff; --surface2:#e9efe7;
    --ink:#182420; --muted:#4c5b53; --line:#cfd8cc;
    --green:#14342b; --green2:#1d4a3a; --gold:#a97f14; --gold-soft:#e8d48a;
    --accent:#8a3b12; --chip:#eef3ec;
    --cert-bg:#fdfcf6; --cert-ink:#22301f; --cert-line:#a97f14;
    --shadow:0 10px 28px rgba(20,52,43,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1713; --surface:#15241e; --surface2:#1a2d25;
      --ink:#e9efe9; --muted:#a9bcb0; --line:#2e453a;
      --green:#0a2018; --green2:#14342b; --gold:#d9b84a; --gold-soft:#6b5a1e;
      --accent:#e08a4c; --chip:#1c3027;
      --cert-bg:#f7f3e4; --cert-ink:#22301f; --cert-line:#8a6a10;
      --shadow:0 10px 28px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.65}
  h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.15;margin:0}
  p{margin:0 0 1em}
  a{color:var(--green2)}
  @media (prefers-color-scheme: dark){ a{color:var(--gold)} }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  button,[role="button"],select,summary,input{ min-height:44px }
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* Nav */
  nav.top{position:sticky;top:0;z-index:20;background:var(--green);color:#f2ecd8}
  nav.top .wrap{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding-top:10px;padding-bottom:10px}
  nav.top .brand{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:1.05rem;margin-right:auto;letter-spacing:.02em}
  nav.top a{color:#f2ecd8;text-decoration:none;font-size:.92rem;font-weight:600;padding:10px 4px;display:inline-block}
  nav.top a:hover{text-decoration:underline}

  /* Hero */
  header.hero{background:var(--green);color:#f4efe0;padding:44px 0 52px}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:center}
  @media(min-width:820px){ .hero-grid{grid-template-columns:1.5fr .9fr} }
  header.hero h1{font-size:2.6rem;font-weight:800;margin-bottom:14px}
  @media(min-width:820px){ header.hero h1{font-size:3.4rem} }
  header.hero .lede{font-size:1.13rem;color:#ddd6bd;max-width:34em}
  header.hero .byline{margin-top:20px;font-size:.98rem;color:#f4efe0}
  header.hero .byline strong{color:var(--gold-soft)}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
  .btn{display:inline-block;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-size:1rem;font-family:inherit}
  .btn-gold{background:var(--gold);color:#141f18}
  .btn-gold:hover{background:#c49a28}
  .btn-ghost{background:transparent;color:#f4efe0;border-color:#8fae9d}
  .btn-ghost:hover{border-color:#f4efe0}
  .emblem{width:100%;max-width:340px;height:auto;aspect-ratio:1/1;object-fit:contain;margin:0 auto;display:block;border-radius:8px;box-shadow:var(--shadow)}
  /* Demo video */
  .demo-frame{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
  .demo-frame video{display:block;width:100%;height:auto;aspect-ratio:1150/640;background:#000;border-radius:4px}
  .demo-caption{margin:12px 4px 2px;color:var(--muted);font-size:.95rem}
  .demo-caption strong{color:var(--ink)}
  .demo-badge{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--chip);padding:4px 10px;border-radius:20px;margin-bottom:12px;color:var(--accent)}
  @media (prefers-color-scheme: dark){ .demo-badge{color:var(--gold)} }

  .hero-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px}
  @media(min-width:820px){ .hero-facts{grid-template-columns:repeat(4,1fr)} }
  .fact{background:var(--green2);border-top:3px solid var(--gold);padding:14px 16px;border-radius:4px}
  .fact b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.45rem;color:#fff}
  .fact span{font-size:.86rem;color:#cfd8c2}

  section{padding:52px 0}
  section.alt{background:var(--surface2)}
  .sec-head{max-width:44em;margin-bottom:28px}
  .sec-head h2{font-size:2rem;margin-bottom:10px}
  .sec-head p{color:var(--muted)}

  /* Steps */
  .steps{display:grid;gap:18px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 22px 8px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:18px}
  .step-num{font-family:"Playfair Display",Georgia,serif;font-size:2rem;font-weight:800;color:var(--gold);line-height:1;width:52px;height:52px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .step h3{font-size:1.28rem;margin-bottom:8px}
  .step p{color:var(--muted)}
  .step p strong{color:var(--ink)}
  .step .do{background:var(--chip);border-radius:6px;padding:12px 16px;margin:0 0 16px}
  .step .do p{margin:0;color:var(--ink);font-size:.95rem}
  .step .do b{color:var(--accent);text-transform:uppercase;font-size:.74rem;letter-spacing:.08em;display:block;margin-bottom:4px}
  @media (prefers-color-scheme: dark){ .step .do b{color:var(--gold)} }

  /* Pipeline */
  .pipe{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:22px 0}
  .pipe .node{flex:1 1 140px;background:var(--green);color:#f4efe0;border-radius:8px;padding:16px;text-align:center}
  .pipe .node b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.05rem;margin-bottom:4px;color:#fff}
  .pipe .node span{font-size:.84rem;color:#cfd8c2}
  .pipe .arrow{align-self:center;font-size:1.3rem;color:var(--gold);font-weight:700}

  /* Engine cards + picker */
  .engines{display:grid;gap:16px}
  @media(min-width:820px){ .engines{grid-template-columns:repeat(3,1fr)} }
  .engine{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:var(--shadow)}
  .engine h3{font-size:1.3rem;margin-bottom:6px}
  .engine .tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--chip);padding:4px 10px;border-radius:20px;margin-bottom:12px;color:var(--accent)}
  @media (prefers-color-scheme: dark){ .engine .tag{color:var(--gold)} }
  .engine ul{margin:0 0 8px;padding-left:20px;color:var(--muted)}
  .engine li{margin-bottom:6px}
  .picker{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:var(--shadow);margin-top:22px}
  .picker h3{font-size:1.3rem;margin-bottom:6px}
  .picker-grid{display:grid;gap:14px;margin:16px 0}
  @media(min-width:820px){ .picker-grid{grid-template-columns:repeat(3,1fr)} }
  .picker label{font-weight:700;font-size:.92rem;display:block}
  .picker select{width:100%;margin-top:6px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem}
  .btn-green{background:var(--green2);color:#fff;border:none}
  .btn-green:hover{background:var(--green)}
  #pickerResult{margin-top:16px;background:var(--chip);border-radius:6px;padding:16px 18px;display:none}
  #pickerResult p{margin:0}

  /* Checklist */
  .checklist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  @media(min-width:820px){ .checklist{grid-template-columns:1fr 1fr} }
  .checklist li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px 16px 52px;position:relative;box-shadow:var(--shadow)}
  .checklist li::before{content:"✓";position:absolute;left:16px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--green2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
  .checklist b{display:block;margin-bottom:2px}
  .checklist span{color:var(--muted);font-size:.95rem}

  /* Sites */
  .sites{display:grid;gap:16px}
  @media(min-width:640px){ .sites{grid-template-columns:1fr 1fr} }
  @media(min-width:960px){ .sites{grid-template-columns:1fr 1fr 1fr} }
  .site{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:6px;padding:20px;box-shadow:var(--shadow)}
  .site h3{font-size:1.15rem;margin-bottom:6px}
  .site p{color:var(--muted);font-size:.95rem;margin:0}
  .site .role{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:8px}
  @media (prefers-color-scheme: dark){ .site .role{color:var(--gold)} }

  /* Lessons */
  .lessons{display:grid;gap:16px}
  @media(min-width:820px){ .lessons{grid-template-columns:1fr 1fr} }
  .lesson{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:var(--shadow)}
  .lesson h3{font-size:1.18rem;margin-bottom:8px}
  .lesson p{color:var(--muted);margin:0}

  /* Certificate */
  .cert{background:var(--cert-bg);color:var(--cert-ink);border:3px double var(--cert-line);border-radius:4px;padding:36px 28px;text-align:center;box-shadow:var(--shadow);max-width:820px;margin:0 auto}
  .cert .school{font-family:"Playfair Display",Georgia,serif;font-size:1.9rem;font-weight:800;letter-spacing:.04em}
  .cert .cert-word{letter-spacing:.35em;text-transform:uppercase;font-size:.8rem;margin:6px 0 20px;color:#6d5a1c}
  .cert .awarded{font-style:italic;color:#4c4a38}
  .cert .name{font-family:"Playfair Display",Georgia,serif;font-size:2rem;font-weight:800;margin:8px 0 4px;border-bottom:1px solid var(--cert-line);display:inline-block;padding:0 18px 6px}
  .cert .title-line{font-weight:700;font-size:1.15rem;margin-bottom:16px}
  .cert .achieve{text-align:left;max-width:560px;margin:0 auto 20px;font-size:.95rem;color:#3d4030}
  .cert .achieve li{margin-bottom:4px}
  .cert .sigs{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;margin-top:26px;font-size:.88rem;color:#4c4a38}
  .cert .sigs div{border-top:1px solid #8a7a3a;padding-top:6px;min-width:180px;text-align:center}

  /* Manual */
  .manual-grid{display:grid;gap:22px}
  @media(min-width:820px){ .manual-grid{grid-template-columns:1.3fr .7fr} }
  .chapters{counter-reset:ch;list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .chapters li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;box-shadow:var(--shadow)}
  .chapters b::before{counter-increment:ch;content:"Chapter " counter(ch) " — ";color:var(--gold)}
  .chapters span{display:block;color:var(--muted);font-size:.94rem;margin-top:2px}
  .manual-box{background:var(--green);color:#f4efe0;border-radius:8px;padding:26px}
  .manual-box h3{color:#fff;margin-bottom:10px;font-size:1.35rem}
  .manual-box p{color:#ddd6bd}
  .manual-box .btn{width:100%;text-align:center}
  #dlNote{font-size:.88rem;margin-top:12px;color:#cfd8c2}

  footer{background:var(--green);color:#cfd8c2;padding:34px 0;font-size:.92rem}
  footer .wrap{display:grid;gap:8px}
  footer strong{color:#f4efe0}

  /* Login gate */
  .login-gate{position:fixed;inset:0;z-index:1000;background:var(--green);color:#f4efe0;display:flex;align-items:center;justify-content:center;padding:24px 20px;overflow-y:auto}
  .login-gate[hidden]{display:none}
  .login-card{background:var(--surface);color:var(--ink);width:100%;max-width:420px;border-radius:8px;border-top:4px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.35);padding:32px 28px 28px}
  .login-card .login-brand{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:1.05rem;color:var(--green2);letter-spacing:.02em;margin-bottom:6px}
  @media (prefers-color-scheme: dark){ .login-card .login-brand{color:var(--gold)} }
  .login-card h2{font-size:1.9rem;margin-bottom:8px}
  .login-card p.lead{color:var(--muted);margin-bottom:20px}
  .login-field{margin-bottom:16px}
  .login-field label{font-weight:700;font-size:.92rem;display:block;margin-bottom:6px}
  .login-field input{width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
  .login-field input:disabled{opacity:.6}
  .login-btn{width:100%;text-align:center;margin-top:4px}
  .login-btn:disabled{opacity:.6;cursor:not-allowed}
  .login-msg{margin-top:16px;border-radius:6px;padding:12px 14px;font-size:.95rem;display:none}
  .login-msg.show{display:block}
  .login-msg.error{background:#fdecea;color:#7a1a12;border:1px solid #e8b4ae}
  .login-msg.locked{background:#fdf3d7;color:#5c4300;border:1px solid #d9b84a}
  @media (prefers-color-scheme: dark){
    .login-msg.error{background:#3a1712;color:#f2b8ae;border-color:#7a2e22}
    .login-msg.locked{background:#2e270e;color:#e8d48a;border-color:#6b5a1e}
  }
  .login-tries{margin-top:12px;font-size:.88rem;color:var(--muted);text-align:center;min-height:1.3em}
  body.locked-scroll{overflow:hidden}

</style>
</head>
<body class="locked-scroll">

<div class="login-gate" id="loginGate" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="login-card">
    <div class="login-brand">Moose College</div>
    <h2 id="loginTitle">Sign in</h2>
    <p class="lead">This site is private. Enter your username and password to continue.</p>
    <form id="loginForm" novalidate>
      <div class="login-field">
        <label for="loginUser">Username</label>
        <input id="loginUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="login-field">
        <label for="loginPass">Password</label>
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-gold login-btn" id="loginBtn" type="submit">Log in</button>
      <div class="login-msg" id="loginMsg" role="alert" aria-live="assertive"></div>
      <p class="login-tries" id="loginTries" aria-live="polite"></p>
    </form>
  </div>
</div>

<script>
(function(){
  var EXPECTED_USER = 'demolayorfreemason';
  var MAX_TRIES = 3;
  var triesLeft = MAX_TRIES;
  var lockedOut = false;
  var gate = document.getElementById('loginGate');
  var form = document.getElementById('loginForm');
  var userInput = document.getElementById('loginUser');
  var passInput = document.getElementById('loginPass');
  var loginBtn = document.getElementById('loginBtn');
  var msg = document.getElementById('loginMsg');
  var triesEl = document.getElementById('loginTries');
  var vault = JSON.parse(document.getElementById('vault').textContent);

  function b64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function showMsg(text, kind){
    msg.textContent = text;
    msg.className = 'login-msg show ' + kind;
  }
  function updateTries(){
    if (lockedOut) { triesEl.textContent = ''; }
    else if (triesLeft < MAX_TRIES) {
      triesEl.textContent = triesLeft === 1 ? '1 try remaining.' : triesLeft + ' tries remaining.';
    } else { triesEl.textContent = ''; }
  }
  function lockOut(){
    lockedOut = true;
    userInput.disabled = true;
    passInput.disabled = true;
    loginBtn.disabled = true;
    loginBtn.textContent = 'Locked out';
    showMsg('Access denied \u2014 you are locked out after 3 failed attempts.', 'locked');
    updateTries();
  }
  function fail(){
    triesLeft--;
    passInput.value = '';
    if (triesLeft <= 0) { lockOut(); }
    else {
      showMsg('Access denied. Wrong username or password.', 'error');
      updateTries();
      passInput.focus();
    }
  }
  function decryptWithPassword(password){
    var salt = b64ToBytes(vault.salt);
    var iv = b64ToBytes(vault.iv);
    var data = b64ToBytes(vault.data);
    var enc = new TextEncoder();
    return window.crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function(baseKey){
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: vault.iterations, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function(key){
        return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
      })
      .then(function(buf){
        return new TextDecoder('utf-8').decode(buf);
      });
  }
  function unlock(decryptedHtml){
    var holder = document.getElementById('protectedContent');
    holder.innerHTML = decryptedHtml;
    holder.hidden = false;
    var scripts = holder.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      var s = document.createElement('script');
      s.textContent = scripts[i].textContent;
      document.body.appendChild(s);
    }
    for (var j = scripts.length - 1; j >= 0; j--) { scripts[j].remove(); }
    gate.hidden = true;
    document.body.classList.remove('locked-scroll');
    window.scrollTo(0, 0);
  }
  if (form) {
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if (lockedOut) return;
      var u = (userInput.value || '').trim().toLowerCase();
      var p = passInput.value || '';
      if (u !== EXPECTED_USER || !p) { fail(); return; }
      if (!window.crypto || !window.crypto.subtle) {
        showMsg('Access denied. This browser cannot decrypt the page.', 'error');
        return;
      }
      loginBtn.disabled = true;
      loginBtn.textContent = 'Checking\u2026';
      decryptWithPassword(p).then(function(decryptedHtml){
        unlock(decryptedHtml);
      }).catch(function(){
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in';
        fail();
      });
    });
    if (userInput) userInput.focus();
  }
})();
</script>
